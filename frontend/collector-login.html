<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Collector Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Smart E-Waste Collection</h1>

    <nav>
        <a href="index.html">Home</a>
    </nav>
</header>

<div class="form-container">

    <h2>Collector Login</h2>

    <form action="../collectorLogin" method="post">

        <input type="email"
               name="email"
               placeholder="Collector Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
